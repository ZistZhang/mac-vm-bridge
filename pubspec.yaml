name: mineru_flow
description: Cross-platform MinerU document-to-Markdown client with automatic long-PDF splitting, resilient task recovery, and result merging.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  archive: ^4.0.9
  pdf_manipulator: 4.1.0
  uuid: ^4.5.2
  crypto: ^3.0.6
  share_plus: ^11.1.0
  open_filex: ^4.7.0
  receive_sharing_intent: ^1.9.0
  desktop_drop: ^0.7.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  image_path: assets/app_icon.png
  android: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  min_sdk_android: 23
