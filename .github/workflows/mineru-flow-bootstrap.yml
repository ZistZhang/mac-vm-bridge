name: MinerU Flow public build bootstrap

on:
  push:
    branches: [mineru-flow-build]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mineru-flow-build
      - name: Expand MinerU Flow source
        shell: bash
        run: |
          cat mineru-flow-bootstrap/source.part-* | base64 --decode > /tmp/mineru-flow.tar.xz
          rm -rf /tmp/mineru-flow-src
          mkdir -p /tmp/mineru-flow-src
          tar -xJf /tmp/mineru-flow.tar.xz -C /tmp/mineru-flow-src
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineru-flow-src/. .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('branches: [main]', 'branches: [mineru-flow-build]')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/mineru-flow-bootstrap.yml
      - name: Publish source mirror
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish MinerU Flow build mirror"
          git push origin HEAD:mineru-flow-build
