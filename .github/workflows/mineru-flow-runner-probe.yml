name: MinerU Flow runner probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mineru-flow-runner-probe.yml
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'mineru-flow-probe')
    runs-on: ubuntu-slim
    steps:
      - run: |
          uname -a
          echo "GitHub hosted runner is available"
