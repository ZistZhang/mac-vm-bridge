name: MinerU Flow cross-platform build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mineru-flow-ci.yml
      - tools/extract_mineru_flow.py
  workflow_dispatch:

concurrency:
  group: mineru-flow-cross-platform
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: host
      - uses: actions/checkout@v4
        with:
          ref: mineru-flow-build
          path: bundle
      - run: python3 host/tools/extract_mineru_flow.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: |
          cd project
          flutter create --platforms=android,windows,macos --org dev.zist --project-name mineru_flow .
          python3 scripts/prepare_platforms.py
          flutter pub get
      - run: cd project && flutter analyze
      - run: cd project && flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: host
      - uses: actions/checkout@v4
        with:
          ref: mineru-flow-build
          path: bundle
      - run: python3 host/tools/extract_mineru_flow.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Build APK
        run: |
          cd project
          flutter create --platforms=android --org dev.zist --project-name mineru_flow .
          python3 scripts/prepare_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MinerU-Flow-0.1.0-android.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MinerU-Flow-Android
          path: project/dist/*
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: host
      - uses: actions/checkout@v4
        with:
          ref: mineru-flow-build
          path: bundle
      - run: python host/tools/extract_mineru_flow.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Build Windows application
        shell: pwsh
        run: |
          Set-Location project
          flutter create --platforms=windows --org dev.zist --project-name mineru_flow .
          python scripts/prepare_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/MinerU-Flow-0.1.0-windows-portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer and checksums
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" project\installer\windows.iss
          Get-FileHash project/dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content project/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MinerU-Flow-Windows
          path: project/dist/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: host
      - uses: actions/checkout@v4
        with:
          ref: mineru-flow-build
          path: bundle
      - run: python3 host/tools/extract_mineru_flow.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Build unsigned DMG
        run: |
          cd project
          flutter create --platforms=macos --org dev.zist --project-name mineru_flow .
          python3 scripts/prepare_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build macos --release
          mkdir -p dist/dmg-root
          APP_PATH="build/macos/Build/Products/Release/MinerU Flow.app"
          if [ ! -d "$APP_PATH" ]; then APP_PATH="build/macos/Build/Products/Release/mineru_flow.app"; fi
          cp -R "$APP_PATH" "dist/dmg-root/MinerU Flow.app"
          ln -s /Applications "dist/dmg-root/Applications"
          hdiutil create -volname "MinerU Flow" -srcfolder dist/dmg-root -ov -format UDZO dist/MinerU-Flow-0.1.0-macos.dmg
          rm -rf dist/dmg-root
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MinerU-Flow-macOS
          path: project/dist/*
          if-no-files-found: error
